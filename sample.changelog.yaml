  - changeSet:
      id: create-product-table
      author: nirmal-sarswat
      comment: Create product table with id and doc columns for storing JSON documents
      labels: ""
      changes:
        - createTable:
            tableName: product
            columns:
              - column:
                  name: id
                  type: INT
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: doc
                  type: JSONB
                  constraints:
                    nullable: true
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: NOW()
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: NOW()
      rollback:
        - dropTable:
            tableName: product
  - changeSet:
      id: insert-product-franks-west-coast-rub
      author: nirmal-sarswat
      comment: Insert initial product row for Frank's West Coast Rub seasoning
      labels: ""
      changes:
        - insert:
            tableName: product
            columns:
              - column:
                  name: id
                  valueNumeric: 1
              - column:
                  name: doc
                  value: '{"name": "Frank''s West Coast Rub","type": "seasoning","price": 7.99,"vegetarian": true}'
      rollback:
        - delete:
            tableName: product
            where: id = 1
  - changeSet:
      id: add-product-columns-from-json
      author: nirmal-sarswat
      comment: Add separate columns for each JSON field in the product table
      labels: ""
      changes:
        - addColumn:
            tableName: product
            columns:
              - column:
                  name: name
                  type: VARCHAR(255)
              - column:
                  name: type
                  type: VARCHAR(255)
              - column:
                  name: price
                  type: NUMERIC(10,2)
              - column:
                  name: vegetarian
                  type: BOOLEAN
      rollback:
        - dropColumn:
            tableName: product
            columnName: name
        - dropColumn:
            tableName: product
            columnName: type
        - dropColumn:
            tableName: product
            columnName: price
        - dropColumn:
            tableName: product
            columnName: vegetarian
  - changeSet:
      id: backfill-product-columns-from-json
      author: nirmal-sarswat
      comment: Backfill new columns with data from the doc JSON column
      labels: ""
      changes:
        - sql:
            sql: |
              UPDATE product
              SET
                name = doc::json->>'name',
                type = doc::json->>'type',
                price = (doc::json->>'price')::NUMERIC,
                vegetarian = (doc::json->>'vegetarian')::BOOLEAN
              WHERE doc IS NOT NULL;
      rollback:
        - sql:
            sql: |
              UPDATE product
              SET name = NULL, type = NULL, price = NULL, vegetarian = NULL;
  - changeSet:
      id: create-product-sync-trigger-function
      author: nirmal-sarswat
      comment: Create trigger function to sync between doc JSON and individual columns
      labels: ""
      changes:
        - sql:
            splitStatements: false
            sql: |
              CREATE OR REPLACE FUNCTION sync_product_columns()
              RETURNS TRIGGER AS $$
              BEGIN
                IF TG_OP = 'INSERT' OR TG_OP = 'UPDATE' THEN
                  IF NEW.doc IS DISTINCT FROM OLD.doc OR TG_OP = 'INSERT' THEN
                    NEW.name := NEW.doc::json->>'name';
                    NEW.type := NEW.doc::json->>'type';
                    NEW.price := (NEW.doc::json->>'price')::NUMERIC;
                    NEW.vegetarian := (NEW.doc::json->>'vegetarian')::BOOLEAN;
                  ELSIF (NEW.name, NEW.type, NEW.price, NEW.vegetarian) IS DISTINCT FROM (OLD.name, OLD.type, OLD.price, OLD.vegetarian) THEN
                    NEW.doc := json_build_object(
                      'name', NEW.name,
                      'type', NEW.type,
                      'price', NEW.price,
                      'vegetarian', NEW.vegetarian
                    )::TEXT;
                  END IF;
                END IF;
                RETURN NEW;
              END;
              $$ LANGUAGE plpgsql;
      rollback:
        - sql:
            sql: DROP FUNCTION IF EXISTS sync_product_columns();
  - changeSet:
      id: create-product-sync-trigger
      author: nirmal-sarswat
      comment: Create trigger to keep doc JSON and individual columns in sync
      labels: ""
      changes:
        - sql:
            sql: |
              CREATE TRIGGER trg_sync_product_columns
              BEFORE INSERT OR UPDATE ON product
              FOR EACH ROW
              EXECUTE FUNCTION sync_product_columns();
      rollback:
        - sql:
            sql: DROP TRIGGER IF EXISTS trg_sync_product_columns ON product;
  - changeSet:
      id: create-project-funding-table-2026-08-03
      author: stephen-atwell
      comment: Create project_funding table with foreign key to projects
      labels: ""
      changes:
        - createTable:
            tableName: project_funding
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: project
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: funder
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: amount
                  type: DECIMAL(15, 2)
                  constraints:
                    nullable: true
              - column:
                  name: approval_status
                  type: VARCHAR(50)
                  constraints:
                    nullable: true
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
      rollback:
        - dropTable:
            tableName: project_funding
  - changeSet:
      id: add-fk-project-funding-to-projects-2026-08-03
      author: stephen-atwell
      comment: Add foreign key from project_funding.project to projects.id
      labels: ""
      changes:
        - addForeignKeyConstraint:
            baseTableName: project_funding
            baseColumnNames: project
            constraintName: fk_project_funding_project
            referencedTableName: projects
            referencedColumnNames: id
            onDelete: CASCADE
      rollback:
        - dropForeignKeyConstraint:
            baseTableName: project_funding
            constraintName: fk_project_funding_project
